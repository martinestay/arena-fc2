<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arena FC-2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Juego de práctica para Física Computacional II: Python, NumPy, Matplotlib, Pandas, archivos, Unix y Git.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: consola de observatorio nocturno. Paneles oscuros como terminal; los gráficos salen en "papel" blanco como en un notebook. */
:root{
  --night:#0a0f1f; --panel:#111a31; --panel-2:#17223f; --rule:#273764; --fg:#e9edf8; --muted:#97a3c7;
  --sol:#e8b25a; --azul:#8fb1e8; --roja:#e8675f; --verde:#5fc99a; --paper:#ffffff; --paper-ink:#1b1b1b;
  --c-kw:#9bbcff; --c-str:#ffd27f; --c-num:#ff9f7d; --c-com:#6b79a3; --c-fn:#7fe3c4; --c-op:#c8d0ea;
  --display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sol);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
code,.mono{font-family:var(--mono)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.brand .mark{width:38px;height:38px;flex:none}
.brand b{font-family:var(--display);font-size:1.1rem;font-weight:600;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:.78rem}
.tools{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--rule);border-radius:10px;padding:7px 12px;color:var(--fg);font-size:.88rem}
.ghost:hover{border-color:var(--muted)}
.ghost[aria-pressed="false"]{color:var(--muted)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:26px}
.hero h1{font-size:clamp(1.8rem,4.2vw,2.7rem);font-weight:600;line-height:1.1}
.hero h1 em{font-style:normal;color:var(--sol)}
.hero p{color:var(--muted);max-width:56ch;margin:14px 0 0}
.hero-code{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;font-family:var(--mono);font-size:.82rem;line-height:1.65;min-width:0;overflow-x:auto;white-space:pre}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 26px;align-items:center}
.chip{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:.86rem;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--sol);background:color-mix(in srgb,var(--sol) 14%,var(--panel))}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.chip[aria-pressed="true"] .dot{background:var(--sol);opacity:1}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mode{position:relative;text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,background .15s;min-width:0}
.mode:hover{border-color:var(--muted);background:var(--panel-2)}
.mode .ico{width:26px;height:26px;color:var(--muted)}
.mode h3{font-size:1.02rem;font-weight:600}
.mode p{margin:0;color:var(--muted);font-size:.92rem}
.mode .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;border-radius:4px;padding:2px 7px;border:1px solid var(--rule);color:var(--muted);font-weight:700}
.rec{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.foot{margin-top:28px;color:var(--muted);font-size:.84rem}

/* ---------- setup ---------- */
.setup{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:22px}
.setup h2{font-size:1.5rem}
.setup .desc{color:var(--muted);margin:6px 0 0}
.lifepick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lp{background:var(--panel-2);border:1.5px solid var(--rule);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.lp[aria-checked="true"]{border-color:var(--roja);background:color-mix(in srgb,var(--roja) 12%,var(--panel-2))}
.lp .hrow{display:flex;gap:2px;min-height:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.lp .hrow svg{width:18px;height:18px}
.lp b{font-size:.9rem}
.lp small{color:var(--muted);font-size:.76rem;line-height:1.25}
.fieldrow{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 220px;min-width:0}
.field input,.field textarea,.field select{background:var(--night);border:1px solid var(--rule);border-radius:10px;padding:9px 11px;color:var(--fg);font:inherit;width:100%}
.field textarea{min-height:84px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.toggle{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.92rem}
.toggle input{width:18px;height:18px;accent-color:var(--sol)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:var(--sol);color:#1d1404;border:0;border-radius:12px;padding:11px 20px;font-weight:700;font-size:.98rem}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:var(--panel-2);color:var(--fg);border:1px solid var(--rule)}
.btn.blue{background:var(--azul);color:#08142c}
.btn[disabled]{opacity:.45;cursor:not-allowed}
kbd{font-family:var(--mono);font-size:.75em;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.75}

/* ---------- HUD ---------- */
#game{position:relative}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:12px 16px;margin-bottom:14px}
.hud .who{display:flex;flex-direction:column;min-width:0}
.hud .who b{font-family:var(--display);font-size:.98rem;font-weight:600}
.hud .who span{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar{height:10px;background:var(--night);border-radius:99px;overflow:hidden;position:relative}
.tbar i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--azul);border-radius:99px;transition:background .3s}
.tbar.low i{background:var(--roja)}
.ttext{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums}
.stats{display:flex;align-items:center;gap:16px}
.stat{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.stat small{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:1.05rem}
.quit{font-size:.8rem;padding:5px 10px}

/* ---------- hearts ---------- */
.lives{display:flex;gap:3px;align-items:center;position:relative}
.heart{width:26px;height:26px;position:relative;flex:none}
.heart svg{width:100%;height:100%;display:block;overflow:visible}
.heart .full{fill:var(--roja)}
.heart .shine{fill:#fff;opacity:.35}
.heart .empty{fill:none;stroke:var(--rule);stroke-width:1.8}
.heart.beat svg{animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.07)}20%{transform:scale(1)}30%{transform:scale(1.04)}}
.heart .half{position:absolute;inset:0;pointer-events:none}
.heart .half.l{clip-path:polygon(0 0,52% 0,44% 28%,58% 46%,42% 66%,54% 100%,0 100%);animation:fallL .9s cubic-bezier(.4,.1,.8,.6) forwards}
.heart .half.r{clip-path:polygon(52% 0,100% 0,100% 100%,54% 100%,42% 66%,58% 46%,44% 28%);animation:fallR .9s cubic-bezier(.4,.1,.8,.6) forwards}
@keyframes fallL{0%{transform:none;opacity:1}15%{transform:translate(-2px,-3px) rotate(-6deg)}100%{transform:translate(-18px,46px) rotate(-55deg);opacity:0}}
@keyframes fallR{0%{transform:none;opacity:1}15%{transform:translate(2px,-3px) rotate(6deg)}100%{transform:translate(18px,46px) rotate(55deg);opacity:0}}
.heart.crack svg{animation:crack .35s steps(2) 2}
@keyframes crack{0%{transform:translateX(-2px) scale(1.1)}50%{transform:translateX(2px) scale(1.15);filter:brightness(2)}100%{transform:none}}
.shard{position:absolute;left:50%;top:50%;width:5px;height:5px;background:var(--roja);border-radius:1px;pointer-events:none;animation:shard .8s ease-out forwards}
@keyframes shard{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.heart.pop svg{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.inf{font-family:var(--mono);font-size:.9rem;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;background:radial-gradient(ellipse at center,transparent 55%,color-mix(in srgb,var(--roja) 30%,transparent))}
#flash.on{animation:flash .55s}
#flash.good{background:radial-gradient(ellipse at center,transparent 65%,color-mix(in srgb,var(--verde) 18%,transparent))}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* ---------- stage ---------- */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:18px;min-width:0}
.prompt{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.prompt h3{font-family:var(--body);font-size:1.12rem;font-weight:700;letter-spacing:0;max-width:62ch}
.topicpill{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--azul);background:var(--panel-2);border-radius:6px;padding:3px 8px;white-space:nowrap}
.code{background:#0d1428;border:1px solid var(--rule);border-radius:12px;padding:14px 16px;font-family:var(--mono);font-size:.92rem;line-height:1.75;overflow-x:auto;white-space:pre;tab-size:4;color:var(--c-op)}
.k{color:var(--c-kw)}.s{color:var(--c-str)}.n{color:var(--c-num)}.c{color:var(--c-com);font-style:italic}.f{color:var(--c-fn)}
input.blank{font-family:var(--mono);font-size:.9rem;background:#1b2648;border:0;border-bottom:2px solid var(--sol);border-radius:5px 5px 0 0;color:#fff;padding:1px 5px;margin:0 1px;min-width:3ch;text-align:center}
input.blank:focus{background:#24325e;outline:none}
input.blank.ok{border-color:var(--verde);background:color-mix(in srgb,var(--verde) 18%,#0d1428)}
input.blank.bad{border-color:var(--roja);background:color-mix(in srgb,var(--roja) 18%,#0d1428)}
input.blank.reveal{border-color:var(--azul);color:var(--azul)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bank button{font-family:var(--mono);font-size:.86rem;background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:5px 10px}
.bank button:hover{border-color:var(--sol)}
.bank button.used{opacity:.3}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.row .grow{flex:1}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel-2);border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:.88rem;white-space:pre-wrap;word-break:break-word;min-width:0}
.opt:hover{border-color:var(--azul)}
.opt .key{flex:none;font-family:var(--body);font-weight:700;font-size:.75rem;color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:1px 6px;margin-top:1px}
.opt.ok{border-color:var(--verde);background:color-mix(in srgb,var(--verde) 16%,var(--panel-2))}
.opt.bad{border-color:var(--roja);background:color-mix(in srgb,var(--roja) 16%,var(--panel-2))}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:14px 16px;border:1px solid var(--rule);background:var(--panel-2);display:flex;flex-direction:column;gap:8px;animation:rise .25s ease-out}
.fb.ok{border-color:color-mix(in srgb,var(--verde) 60%,var(--rule))}
.fb.bad{border-color:color-mix(in srgb,var(--roja) 60%,var(--rule))}
.fb b{font-family:var(--display);font-size:.98rem;font-weight:600}
.fb.ok b{color:var(--verde)}.fb.bad b{color:var(--roja)}
.fb p{margin:0;color:var(--fg);max-width:75ch}
.fb .code{font-size:.84rem;padding:10px 12px}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--verde);color:#06261a;font-weight:700;border-radius:999px;padding:6px 16px;z-index:60;font-family:var(--mono);animation:toast 1s ease-out forwards;pointer-events:none}
.toast.bad{background:var(--roja);color:#2b0705}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.turn{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.turn .who{font-family:var(--display);font-size:1.25rem;font-weight:600;color:var(--fg)}
.turn .next{color:var(--muted);font-size:.88rem}
.roster{display:flex;gap:6px;flex-wrap:wrap}
.roster span{font-size:.8rem;border:1px solid var(--rule);border-radius:999px;padding:2px 10px;color:var(--muted)}
.roster span.on{border-color:var(--sol);color:var(--fg)}

/* ---------- order ---------- */
.order{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.order .col{display:flex;flex-direction:column;gap:6px;min-height:120px;background:#0d1428;border:1px dashed var(--rule);border-radius:12px;padding:10px;min-width:0}
.order .col .label{margin-bottom:4px}
.ol{font-family:var(--mono);font-size:.84rem;text-align:left;background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;white-space:pre;overflow-x:auto}
.ol:hover{border-color:var(--azul)}
.ol.ok{border-color:var(--verde)}.ol.bad{border-color:var(--roja)}
.ol .num{color:var(--muted);margin-right:8px}

/* ---------- terminal ---------- */
.term{background:#05080f;border:1px solid var(--rule);border-radius:12px;padding:14px;font-family:var(--mono);font-size:.9rem;min-height:220px;max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.term .ps{color:var(--verde)}.term .path{color:var(--azul)}
.term .out{color:#c9d2ea;white-space:pre-wrap}
.term .err{color:var(--roja);white-space:pre-wrap}
.term .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.term input{flex:1;min-width:120px;background:transparent;border:0;color:#fff;font:inherit;outline:none;caret-color:var(--sol)}
.task{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.task b{color:var(--sol);font-family:var(--mono)}

/* ---------- lab ---------- */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
.lab .left{display:flex;flex-direction:column;gap:12px;min-width:0}
.codeview{background:#0d1428;border:1px solid var(--rule);border-radius:12px;padding:8px 0;font-family:var(--mono);font-size:.82rem;line-height:1.6;overflow-x:auto}
.cl{display:flex;gap:0;padding:1px 12px 1px 0;border-left:3px solid transparent;white-space:pre;cursor:default}
.cl .no{width:34px;flex:none;text-align:right;padding-right:12px;color:#4d5a82;user-select:none}
.cl.run{background:color-mix(in srgb,var(--sol) 14%,transparent);border-left-color:var(--sol)}
.cl.done .no{color:var(--muted)}
.picking .cl{cursor:pointer}
.picking .cl:hover{background:color-mix(in srgb,var(--azul) 14%,transparent);border-left-color:var(--azul)}
.cl.bad{background:color-mix(in srgb,var(--roja) 20%,transparent);border-left-color:var(--roja)}
.cl.found{background:color-mix(in srgb,var(--verde) 16%,transparent);border-left-color:var(--verde)}
.cl.err{background:color-mix(in srgb,var(--roja) 26%,transparent);border-left-color:var(--roja)}
.figwrap{position:relative;background:var(--paper);border-radius:12px;overflow:hidden;border:1px solid var(--rule)}
.figwrap canvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%}
.figbar{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:#555;background:#f1f1ee;padding:5px 10px;font-family:var(--mono);gap:8px}
.traceback{position:absolute;left:10px;right:10px;bottom:10px;background:#fff0ef;border:1px solid #f3b6b1;border-radius:8px;color:#9c1c12;font-family:var(--mono);font-size:.78rem;padding:10px 12px;white-space:pre-wrap;animation:rise .25s}
.goal{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center}
.goal .mini{background:var(--paper);border-radius:8px;overflow:hidden;border:1px solid var(--rule)}
.goal .mini canvas{display:block;width:100%;aspect-ratio:4/3}
.goal p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.vars{background:#0d1428;border:1px solid var(--rule);border-radius:12px;padding:8px 12px;font-family:var(--mono);font-size:.76rem;display:flex;flex-direction:column;gap:2px;max-height:150px;overflow:auto}
.vars div{display:flex;gap:10px;white-space:nowrap}
.vars .vn{color:var(--c-fn);min-width:70px}
.vars .vv{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.vars .fresh{animation:fresh .8s}
@keyframes fresh{from{background:color-mix(in srgb,var(--sol) 30%,transparent)}to{background:transparent}}
.step{display:flex;gap:10px;align-items:center;font-size:.92rem;color:var(--muted)}
.step b{color:var(--fg)}
.step .label{white-space:nowrap}
.fixes{display:flex;flex-direction:column;gap:8px}
.fixes .opt{font-size:.8rem}

/* ---------- duel ---------- */
.duel{display:grid;grid-template-columns:200px minmax(0,1fr) 200px;gap:14px;align-items:stretch}
.side{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .2s,background .2s}
.side.p1{--team:var(--roja)}.side.p2{--team:var(--azul)}
.side h3{font-size:.95rem;color:var(--team);overflow-wrap:anywhere}
.side .rep{font-size:.84rem;color:var(--muted)}
.side .pts{font-family:var(--display);font-size:2.4rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.side .pts small{font-size:.9rem;color:var(--muted);font-weight:500}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.pad button{background:var(--panel-2);border:1.5px solid var(--rule);border-radius:10px;padding:14px 4px;font-family:var(--display);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.pad button:hover{border-color:var(--team)}
.pad button small{font-family:var(--mono);font-size:.68rem;color:var(--muted);font-weight:400}
.side.locked{opacity:.55}
.side.won{border-color:var(--verde);background:color-mix(in srgb,var(--verde) 10%,var(--panel))}

.duel .center{display:flex;flex-direction:column;gap:12px;min-width:0}
.dopts{display:flex;flex-direction:column;gap:8px}

.dopt .key{font-family:var(--display);font-weight:600;color:var(--muted);flex:none;width:18px}
.dopt.ok{border-color:var(--verde)}
.dopt .mk{margin-left:auto;font-family:var(--body);font-size:.75rem;font-weight:700;display:flex;gap:4px;flex:none}
.dopt .mk span{border-radius:4px;padding:0 5px}
.mk .m1{background:var(--roja);color:#2b0705}.mk .m2{background:var(--azul);color:#08142c}

/* ---------- end ---------- */
.end{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.end .big{font-family:var(--display);font-size:clamp(1.9rem,5vw,3rem);font-weight:600;line-height:1.05}
.end .sub{color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:14px}
.kpi small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kpi b{font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums}
.newrec{display:inline-block;background:var(--sol);color:#1d1404;font-weight:700;border-radius:8px;padding:3px 10px;font-size:.85rem;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;font-variant-numeric:tabular-nums}
table.t th{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.nota{font-family:var(--display);font-size:4rem;font-weight:600;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--night);overflow:hidden}
.bar i{display:block;height:100%;background:var(--azul)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}

};

/* =====================================================================
   Generador pseudoaleatorio con semilla (para datos de los gráficos)
   ===================================================================== */
const R = (() => {
  let s = 1;
  const f = {
    seed(n) { s = (n * 2654435761) >>> 0 || 1; },
    rand() { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; },
    uniform(a, b) { return a + (b - a) * f.rand(); },
    normal(m = 0, sd = 1) { let u = 0; while (!u) u = f.rand(); return m + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * f.rand()); },
    arr(n, g) { return Array.from({ length: n }, g); }
  };
  return f;
})();
const linspace = (a, b, n) => Array.from({ length: n }, (_, i) => a + (b - a) * i / (n - 1));
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const std = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };

const L_SOL = 3.828e26, PC = 3.0857e16;
const tempColor = T => { // color aproximado de una estrella según su temperatura (RdYlBu)
  const stops = [[3000, [215, 48, 39]], [4500, [252, 141, 89]], [6000, [254, 224, 144]], [7500, [145, 191, 219]], [10000, [69, 117, 180]]];
  for (let i = 1; i < stops.length; i++) if (T <= stops[i][0]) { const [a, ca] = stops[i - 1], [b, cb] = stops[i]; const u = (T - a) / (b - a); return `rgb(${ca.map((c, j) => Math.round(c + (cb[j] - c) * u)).join(',')})`; }
  return 'rgb(69,117,180)';
};

function transitData(sign) {
  R.seed(7);
  const t = linspace(0, 10, 500);
  const f0 = t.map(() => 1 + R.normal(0, 0.002));
  const m = t.map(x => x >= 4.5 && x <= 5.0);
  const f = f0.map((v, i) => m[i] ? v + sign * 0.02 : v);
  return { t, f0, m, f, u: mean(f) - 3 * std(f) };
}

/* =====================================================================
   Resaltado de sintaxis Python
   ===================================================================== */
const KW = new Set('def class return if else elif for in while import from as with not and or is lambda True False None assert try except pass break continue yield'.split(' '));
function hl(code) {
  const re = /(#[^\n]*)|([fFrRbB]?"(?:[^"\\\n]|\\.)*"?|[fFrRbB]?'(?:[^'\\\n]|\\.)*'?)|(\b\d[\d_]*\.?\d*(?:e[-+]?\d+)?)|([A-Za-z_\u0001][\w\u0001]*)|([\s\S])/g;
  let out = '', m;
  while ((m = re.exec(code))) {
    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="n">${esc(m[3])}</span>`;
    else if (m[4]) {
      const w = m[4];
      if (KW.has(w)) out += `<span class="k">${w}</span>`;
      else if (code[re.lastIndex] === '(') out += `<span class="f">${esc(w)}</span>`;
      else out += esc(w);
    } else out += esc(m[5]);
  }
  return out;
}

class LifeBar {
  constructor(el, n) {

      this.count.textContent = '∞ · ' + this.errors + (this.errors === 1 ? ' error' : ' errores');

}

const Timer = {
  run: false, left: 0, total: 1, onEnd: null, last: 0, lastSec: -1, raf: 0,
  start(sec, onEnd) { this.total = sec; this.left = sec; this.onEnd = onEnd; this.run = true; this.last = performance.now(); this.lastSec = -1; $('#tbar').hidden = false; cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(t => this.tick(t)); },
  tick(now) {
    if (this.run) {
      this.left -= (now - this.last) / 1000;
      if (this.left <= 0) { this.left = 0; this.run = false; this.draw(); const f = this.onEnd; this.onEnd = null; f && f(); return; }
      const s = Math.ceil(this.left); if (s <= 5 && s !== this.lastSec) { this.lastSec = s; Snd.tick(); }
    }
    this.last = now; this.draw();
    this.raf = requestAnimationFrame(t => this.tick(t));
  },
  draw() {
    $('#tfill').style.width = (100 * this.left / this.total) + '%';
    $('#tbar').classList.toggle('low', this.left <= Math.min(5, this.total * .25));
    const s = Math.ceil(this.left);
    $('#ttext').textContent = s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : s + ' s';
  },
  pause() { this.run = false; },
  resume() { if (this.left > 0 && this.onEnd) { this.run = true; this.last = performance.now(); } },
  add(s) { this.left = Math.max(0.01, this.left + s); if (this.left > this.total) this.total = this.left; this.draw(); },
  stop() { this.run = false; this.onEnd = null; cancelAnimationFrame(this.raf); },
  none(text) { this.stop(); $('#tfill').style.width = '100%'; $('#tbar').classList.remove('low'); $('#ttext').textContent = text || 'sin reloj'; },
};

// Revisa un orden propuesto (seq: índices de q.l) y marca cada línea como válida o no.
// Reglas: las dependencias de q.dep y los bloques por sangría, como los lee Python.
function orderMarks(q, seq) {
  const ind = x => x.match(/^ */)[0].length;
  const dep = i => q.dep ? (q.dep[i] || []) : (i ? [i - 1] : []);
  const blockSize = h => { let k = h + 1; while (k < q.l.length && ind(q.l[k]) > ind(q.l[h])) k++; return k - h - 1; };
  const header = j => { for (let k = j - 1; k >= 0; k--) if (ind(q.l[k]) < ind(q.l[j])) return k; return -1; };
  const pos = {}; seq.forEach((i, k) => pos[i] = k);
  const lineOk = i => {
    if (!dep(i).every(d => pos[d] != null && pos[d] < pos[i])) return false;
    for (let h = 0; h < q.l.length; h++) {
      const n = blockSize(h); if (!n || pos[h] == null) continue;
      const inside = pos[i] > pos[h] && pos[i] <= pos[h] + n;
      let mine = false; for (let x = header(i); x >= 0; x = header(x)) if (x === h) mine = true;
      if (mine !== inside) return false;
    }
    return true;
  };
  return seq.map(lineOk);
}

    if (timeout) { done = true; placed.length = 0; placed.push(...q.l.map(txt => items.find(it => it.txt === txt))); draw(q.l.map(() => true)); onDone({ ok: false, ex: q.ex, card }); return; }
    const marks = orderMarks(q, placed.map(it => it.i));
    if (marks.every(Boolean)) { done = true; draw(marks); onDone({ ok: true, ex: q.ex, card }); }
    else { draw(marks); onMiss && onMiss(marks.filter(Boolean).length); }
  }
  return { check, card, finish: () => { done = true; checkBtn.disabled = true; } };
}

// Terminal
const termNorm = s => s.trim().replace(/\s+/g, ' ').replace(/'/g, '"').replace(/\/$/, '');
function renderTerm(box, q, { onDone }) {
  const card = h('div', { class: 'card' });
  card.append(h('div', { class: 'prompt' }, h('div', { class: 'task' }, h('b', {}, '$'), h('h3', {}, q.q)), h('span', { class: 'topicpill' }, TOPICS[q.t])));
  const term = h('div', { class: 'term' });
  const input = h('input', { id: 'termInput', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Comando' });
  const ps = () => h('span', {}, h('span', { class: 'path' }, '~/fiscompii'), ' $');
  const line = h('div', { class: 'line' }, ps(), input);
  term.append(h('div', { class: 'out' }, 'Escribe el comando y presiona Enter.'), line);
  card.append(term); box.append(card);
  setTimeout(() => input.focus({ preventScroll: true }), 30);
  let done = false;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  term.addEventListener('click', () => input.focus());
  function check(timeout) {
    if (done) return; done = true;
    const v = input.value;
    const ok = !timeout && q.a.some(a => termNorm(a) === termNorm(v));
    const echo = h('div', { class: 'line' }, ps(), h('span', {}, v || ''));
    line.replaceWith(echo);
    if (ok) { if (q.out) term.append(h('div', { class: 'out' }, q.out)); }
    else { term.append(h('div', { class: 'err' }, timeout ? '^C  (se acabó el tiempo)' : `bash: no hace lo pedido`), h('div', { class: 'out' }, '# correcto: ' + q.a[0])); }
    term.scrollTop = term.scrollHeight;
    onDone({ ok, answer: q.a[0], ex: q.a.length > 1 ? 'También vale: ' + q.a.slice(1).join(' · ') : '', card });
  }
  return { check, card };
}

function feedback(card, { ok, title, ex, answer, showAnswer, next, nextLabel = 'Siguiente' }) {
  const fb = h('div', { class: 'fb ' + (ok ? 'ok' : 'bad') }, h('b', {}, title || (ok ? 'Correcto' : 'Incorrecto')));
  if (!ok && showAnswer && answer) fb.append(h('div', { class: 'code', html: hl(answer) }));
  if (ex) fb.append(h('p', { html: ex }));
  let fired = false;
  const go = () => { if (fired) return; fired = true; cleanup(); next(); };
  if (next) { const b = h('button', { class: 'btn', type: 'button', onclick: go }, nextLabel + ' ', h('kbd', {}, '⏎')); fb.append(h('div', { class: 'row', style: 'margin-top:4px' }, b)); setTimeout(() => b.focus({ preventScroll: true }), 50); }
  card.append(fb);
  fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  const key = e => { const tag = document.activeElement?.tagName; if ((e.key === 'Enter' || e.key === ' ') && next && tag !== 'INPUT' && tag !== 'BUTTON' && tag !== 'TEXTAREA') { e.preventDefault(); go(); } };
  const cleanup = () => document.removeEventListener('keydown', key);
  setTimeout(() => document.addEventListener('keydown', key), 120);
  Game.cleanups.push(cleanup);
  return fb;
}

const Game = {
  mode: null, cfg: null, score: 0, streak: 0, best: 0, ok: 0, bad: 0, lives: null, cleanups: [], keyHandler: null,
  reset() { this.cleanups.forEach(f => f()); this.cleanups = []; if (this.keyHandler) document.removeEventListener('keydown', this.keyHandler); this.keyHandler = null; Timer.stop(); this.score = 0; this.streak = 0; this.best = 0; this.ok = 0; this.bad = 0; },
  onKeys(fn) { if (this.keyHandler) document.removeEventListener('keydown', this.keyHandler); this.keyHandler = fn; document.addEventListener('keydown', fn); },
  hud() { $('#hudScore').textContent = this.score; $('#hudStreak').textContent = this.streak >= 2 ? `${this.streak} ×${this.mult()}` : this.streak; },
  mult() { return Math.min(5, 1 + Math.floor(this.streak / 3)); },
  right(base, timeFrac = 0, partial = false) {
    this.ok++; this.streak++; this.best = Math.max(this.best, this.streak);
    let pts = Math.round((base + base * timeFrac) * this.mult() * (partial ? .5 : 1));
    this.score += pts; this.hud(); Snd.ok(); flash(true); toast('+' + pts);
    if (this.streak % 5 === 0 && this.lives) this.lives.gain();
    return pts;
  },
  wrong() { this.bad++; this.streak = 0; this.hud(); Snd.bad(); return this.lives ? this.lives.lose() : true; },
};

function start(m, cfg) {

/* ---------- Modos individuales (Contrarreloj, ¿Qué imprime?, Ordena, Terminal) ---------- */
const Solo = {
  start(m, cfg) {
    this.m = m; this.cfg = cfg; this.level = 1; this.n = 0;
    this.pick = { reloj: deck(FILL), oraculo: deck(MCQ), orden: deck(ORDER), terminal: deck(TERM) }[m.id];
    setHud(m.name, 'Nivel 1');
    this.next();
  },
  time() {
    const L = this.level;
    return { reloj: Math.max(16, 46 - 4 * (L - 1)), oraculo: Math.max(9, 26 - 2 * (L - 1)), orden: Math.max(45, 110 - 8 * (L - 1)), terminal: Math.max(10, 28 - 2 * (L - 1)) }[this.m.id];
  },
  next() {
    const stage = $('#stage'); stage.innerHTML = '';
    const q = this.pick(); this.n++;
    $('#hudSub').textContent = `Nivel ${this.level} · pregunta ${this.n}`;
    const total = this.time(); let r;
    const done = res => {
      Timer.pause();
      const frac = Timer.left / total;
      if (res.ok) {
        Game.right(this.m.id === 'orden' ? 150 : 100, frac, res.partial);
        if (Game.ok % 3 === 0) { this.level++; toast('Nivel ' + this.level); }
      } else Game.wrong();
      const alive = !Game.lives || Game.lives.alive;
      const showAns = this.m.id === 'reloj' || this.m.id === 'oraculo';
      feedback(res.card, { ok: res.ok, title: res.ok ? (res.partial ? 'Correcto, con pista' : 'Correcto') : (Timer.left <= 0 ? 'Se acabó el tiempo' : 'Incorrecto'), ex: res.ex, answer: res.answer, showAnswer: showAns && this.m.id === 'oraculo', next: alive ? () => this.next() : () => endSolo(), nextLabel: alive ? 'Siguiente' : 'Ver resultado' });
    };
    if (this.m.id === 'reloj') r = renderFill(stage, q, { bank: this.cfg.bank, onDone: done });
    else if (this.m.id === 'oraculo') { r = renderMCQ(stage, q, { onDone: done }); Game.onKeys(e => { if (/^[1-4]$/.test(e.key)) r.keys(+e.key - 1); }); }
    else if (this.m.id === 'orden') r = renderOrder(stage, q, { onDone: done, onMiss: () => { Game.streak = 0; Game.bad++; Game.hud(); Snd.bad(); const alive = Game.lives.lose(); toast('Orden incorrecto', true); if (!alive) { Timer.pause(); r.finish(); feedback(r.card, { ok: false, title: 'Sin vidas', ex: q.ex + '<br>Orden correcto:', answer: q.l.join('\n'), showAnswer: true, next: () => endSolo(), nextLabel: 'Ver resultado' }); } } });
    else r = renderTerm(stage, q, { onDone: done });
    Timer.start(total, () => r.check(true));
  }
};

function endSolo(extraKpis = []) {

        h('div', { class: 'goal' }, h('div', { class: 'mini' }, mini), h('div', {}, h('div', { class: 'label' }, 'Objetivo'), h('p', {}, ch.obj)))),

    Lab.tok = (Lab.tok || 0) + 1; Group.over = true;
    if (played && ['reloj', 'oraculo', 'orden', 'terminal', 'lab'].includes(id)) return endSolo(id === 'lab' ? [kpi('Figuras', Lab.n)] : []);
    if (played && id === 'grupo') return Group.end();
